services:
  postgres:
    image: postgres:16-alpine
    container_name: painel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel_dev_local
      POSTGRES_DB: painel_chamada
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: painel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
