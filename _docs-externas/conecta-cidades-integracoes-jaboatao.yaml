
# Spec da documentação PÚBLICA de integrações externas, renderizada pelo
# Scalar em /docs/integracoes (ApiDocsController#integracoes).
#
# Template ERB: o controller injeta `base_url`, `host` e `public_key`
# (chave pública JWT, já indentada) antes de entregar ao Scalar.
#
# A documentação completa da API externa (todos os recursos) vive em
# config/api_docs/openapi_internal.yml, servida em /admin/api-reference
# (requer login).

info:
  title: Conecta Cidades — Integrações Externas
  description: |
    Documentação pública para sistemas externos que integram com a plataforma
    Conecta Cidades. Cobre quatro áreas:

    - **Login Integrado (SSO)** — cidadãos autenticados no portal acessam
      sistemas externos sem novo login, via token JWT.
    - **Notificações Push** — envio de notificações push para cidadãos
      identificados por CPF.
    - **Webhooks** — eventos que a plataforma envia (demandas, agendamentos,
      inscrições, formulários, cidadão) para endpoints cadastrados, com
      assinatura HMAC e novas tentativas.
    - **Tramitação por Sistemas Externos** — solicitação de tramitação enviada
      ao sistema externo e endpoint de retorno da decisão.

    > 📚 **Documentação completa da API** (formulários, enquetes, agendamentos,
    > inscrições, eventos e demais recursos): [/admin/api-reference](/admin/api-reference)
    > — requer login de usuário administrador.

    ## Autenticação

    Os endpoints da API externa exigem um Bearer token no header `Authorization`:

    ```
    Authorization: Bearer SEU_TOKEN_AQUI
    ```

    Tokens são emitidos pelo administrador da plataforma, com permissões
    granulares por recurso (`introspect_api`, `citizen_notifications_api`,
    `ai_agents_api`). Para cada aplicativo integrado é fornecido um token
    específico.

    ## Limites de requisição (rate limiting)

    As chamadas são limitadas **por token**, em duas janelas: por minuto
    (padrão 300/min) e por dia
    (padrão 30000/dia), ajustáveis por
    token. Toda resposta autenticada traz `X-RateLimit-Limit`,
    `X-RateLimit-Remaining` e `X-RateLimit-Reset` (epoch da janela de minuto);
    ao exceder, a API responde **429** com corpo `RateLimitError` e header
    `Retry-After` (segundos). A janela diária é alinhada ao epoch: zera às
    **00:00 UTC** (21:00 no horário de Brasília), não à meia-noite local.

    ## Formato de erro

    Toda resposta de erro é um objeto JSON com `error`, `message`,
    `error_code` (código estável) e `request_id` — informe o `request_id` ao
    reportar problemas. Ver schema `Error`.
